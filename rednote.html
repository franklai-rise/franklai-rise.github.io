<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>最棒的L · 小红书 rednote</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; background: #faf7f8; color: #25252a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.6; }
    main { width: 100%; max-width: 420px; }
    .back { display: inline-block; margin-bottom: 18px; color: #666; font-size: 13px; text-decoration: none; }
    .card { padding: 32px; border: 1px solid #eee2e5; border-radius: 24px; background: white; box-shadow: 0 12px 42px #59203208; }
    .brand { margin: 0 0 28px; color: #d91c40; font-size: 14px; font-weight: 650; }
    .brand span { margin-left: 6px; font-weight: 400; }
    .identity { display: flex; align-items: center; gap: 16px; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: #faf7f8; }
    h1 { margin: 0; font-size: 26px; line-height: 1.3; }
    .handle { margin: 6px 0 0; color: #777; font-size: 13px; }
    .bio { margin: 25px 0; font-size: 15px; }
    .bio p { margin: 6px 0; }
    .stats { padding: 18px 0; border-top: 1px solid #f0e9eb; border-bottom: 1px solid #f0e9eb; }
    .stats strong { font-size: 29px; letter-spacing: -0.5px; }
    .stats span { margin-left: 9px; color: #666; font-size: 13px; }
    .stats small { display: block; color: #888; font-size: 11px; }
    .visit { display: block; margin-top: 24px; padding: 11px 16px; border-radius: 999px; background: #d91c40; color: white; text-align: center; text-decoration: none; font-size: 14px; font-weight: 600; }
    .visit:hover { background: #b91635; }
    a:focus-visible { outline: 3px solid #1772d0; outline-offset: 4px; }
    .note { margin: 12px 0 0; color: #888; font-size: 11px; text-align: center; }
    @media (max-width: 360px) { .card { padding: 24px; } h1 { font-size: 23px; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← 返回学术主页 / Home</a>
    <article class="card" aria-label="小红书个人名片">
      <p class="brand">小红书 <span>rednote</span></p>
      <div class="identity">
        <img class="avatar" src="images/profile-2026.jpg" width="72" height="72" alt="赖近昇">
        <div><h1>最棒的L</h1><p class="handle">小红书号：ljs_scut</p></div>
      </div>
      <div class="bio">
        <p>🎓 工科硕士在读</p>
        <p>🔥 聚焦于多方面自我提升</p>
        <p>⚡ 仍然在不断摸索我的人生</p>
        <p>✅ 近期重点关注 AI 科研探索</p>
        <p>希望你能从我的笔记得到有用的信息。</p>
      </div>
      <div class="stats"><strong>1,558</strong><span>粉丝 · followers</span><small>截至 2026 年 9 月 · 非实时数据</small></div>
      <a class="visit" href="https://www.xiaohongshu.com/user/profile/5b5be1fd11be10585f16d4cb" target="_blank" rel="noopener noreferrer">前往小红书主页 ↗</a>
      <p class="note">此名片无需登录。查看小红书笔记或关注可能需要登录。</p>
    </article>
  </main>
</body>
</html>
